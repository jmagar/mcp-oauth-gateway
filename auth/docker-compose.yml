x-mcp-common: &mcp-common
  restart: unless-stopped
  env_file: ../.env
  networks:
    - mcp-net

x-mcp-healthcheck: &mcp-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5

services:
  mcp-oauth:
    <<: *mcp-common
    build:
      context: ..
      dockerfile: auth/Dockerfile
    container_name: mcp-oauth
    volumes:
      - ../logs/auth:/logs
    depends_on:
      mcp-oauth-redis:
        condition: service_healthy
    healthcheck:
      <<: *mcp-healthcheck
      test: ["CMD", "curl", "-f", "-s", "http://localhost:8000/.well-known/oauth-authorization-server"]
      start_period: 30s

  mcp-oauth-redis:
    <<: *mcp-common
    image: redis:7-alpine
    container_name: mcp-oauth-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --save 60 1
      --save 300 10
      --save 900 100
      --appendonly yes
    volumes:
      - ${MCP_OAUTH_REDIS_DATA:-mcp-oauth-redis-data}:/data
    healthcheck:
      <<: *mcp-healthcheck
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]

networks:
  mcp-net:
    name: ${MCP_NETWORK:-mcp-oauth}
    external: true

volumes:
  mcp-oauth-logs:
  mcp-oauth-redis-data:
