# CORS headers snippet — generated by scripts/generate_middlewares.py
# Include this file inside an authenticated location block.
#
# IMPORTANT: This snippet echoes $http_origin back to the caller.
# It MUST only be included inside location blocks that are already
# protected by origin validation (e.g. via $origin_valid guard in the
# server block) or behind auth_request. Do not include in public/static
# locations without additional origin validation.
#
# Allowed origins (from MCP_CORS_ORIGINS):
#   http://localhost

add_header Access-Control-Allow-Origin $http_origin always;
add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, DELETE" always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, MCP-Protocol-Version, Mcp-Session-Id, Last-Event-ID" always;
add_header Access-Control-Allow-Credentials "true" always;
add_header Access-Control-Max-Age "3600" always;
