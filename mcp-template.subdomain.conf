## MCP OAuth Gateway - SWAG Reverse Proxy Template (Simplified)
##
## The gateway now handles auth, routing, CORS, origin validation, and streaming
## internally. SWAG only needs to do TLS termination and forward all traffic.
##
## Copy this file, replace all {{PLACEHOLDERS}}, and save as:
##   /mnt/appdata/swag/nginx/proxy-confs/{{SERVICE_NAME}}.subdomain.conf
##
## Placeholders:
##   {{SERVICE_NAME}}    - e.g. fetch, memory, time
##   {{DOMAIN}}          - e.g. fetch.tootie.tv
##   {{GATEWAY_HOST}}    - e.g. mcp-oauth (Docker) or 100.x.x.x (Tailscale)
##   {{GATEWAY_PORT}}    - e.g. 8000

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name {{DOMAIN}};

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        proxy_pass http://{{GATEWAY_HOST}}:{{GATEWAY_PORT}};

        # Forward client identity
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming support (SSE, long-lived MCP connections)
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
